<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">The build loop</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#475569">One designer + an AI pair, kept honest by continuous review</text>

  <!-- Designer box -->
  <rect x="90" y="170" width="300" height="210" rx="16" fill="#eef4fb" stroke="#1976d2" stroke-width="2"/>
  <text x="240" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#1565c0">Designer (me)</text>
  <text x="240" y="252" text-anchor="middle" font-size="16" fill="#334155">Specs · standards</text>
  <text x="240" y="282" text-anchor="middle" font-size="16" fill="#334155">Taste · judgment</text>
  <text x="240" y="312" text-anchor="middle" font-size="16" fill="#334155">Accessibility · governance</text>
  <text x="240" y="342" text-anchor="middle" font-size="16" fill="#334155">The “why”</text>

  <!-- Claude box -->
  <rect x="810" y="170" width="300" height="210" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="960" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">Claude (the pair)</text>
  <text x="960" y="252" text-anchor="middle" font-size="16" fill="#334155">Generate at volume</text>
  <text x="960" y="282" text-anchor="middle" font-size="16" fill="#334155">Hold every convention</text>
  <text x="960" y="312" text-anchor="middle" font-size="16" fill="#334155">Keep it consistent</text>
  <text x="960" y="342" text-anchor="middle" font-size="16" fill="#334155">Never lose the thread</text>

  <!-- Arrow Designer -> Claude (top) -->
  <line x1="390" y1="232" x2="810" y2="232" stroke="#1976d2" stroke-width="3" marker-end="url(#ar)"/>
  <text x="600" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#1565c0">sharp specs in</text>

  <!-- Arrow Claude -> Designer (bottom) -->
  <line x1="810" y1="320" x2="390" y2="320" stroke="#64748b" stroke-width="3" marker-end="url(#ar2)"/>
  <text x="600" y="345" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">artifacts out → I review</text>

  <!-- Artifacts strip -->
  <rect x="300" y="440" width="600" height="70" rx="14" fill="#1976d2"/>
  <text x="600" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Artifacts that stay coherent</text>
  <text x="600" y="498" text-anchor="middle" font-size="15" fill="#dbeafe">tokens · MUI theme · 27 components · 75 doc pages · 17 pitches</text>

  <line x1="600" y1="380" x2="600" y2="440" stroke="#1976d2" stroke-width="3" stroke-dasharray="2 0" marker-end="url(#ar)"/>

  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1976d2"/>
    </marker>
    <marker id="ar2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
