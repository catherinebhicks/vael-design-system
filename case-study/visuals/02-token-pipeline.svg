<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">One source of truth, no retyped hex codes</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#475569">Design and engineering stay in sync automatically</text>

  <!-- pipeline nodes -->
  <g>
    <rect x="60" y="190" width="190" height="90" rx="14" fill="#eef4fb" stroke="#1976d2" stroke-width="2"/>
    <text x="155" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">Figma</text>
    <text x="155" y="255" text-anchor="middle" font-size="14" fill="#334155">variables</text>

    <rect x="300" y="190" width="190" height="90" rx="14" fill="#eef4fb" stroke="#1976d2" stroke-width="2"/>
    <text x="395" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">Supernova</text>
    <text x="395" y="255" text-anchor="middle" font-size="14" fill="#334155">auto-opens a PR</text>

    <rect x="540" y="190" width="190" height="90" rx="14" fill="#1976d2"/>
    <text x="635" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Token JSON</text>
    <text x="635" y="251" text-anchor="middle" font-size="13" fill="#dbeafe">W3C standard</text>
    <text x="635" y="269" text-anchor="middle" font-size="13" fill="#dbeafe">base + themes</text>

    <rect x="780" y="190" width="190" height="90" rx="14" fill="#eef4fb" stroke="#1976d2" stroke-width="2"/>
    <text x="875" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">MUI theme</text>
    <text x="875" y="251" text-anchor="middle" font-size="13" fill="#334155">generated file</text>
    <text x="875" y="269" text-anchor="middle" font-size="13" fill="#334155">do not edit</text>

    <rect x="1010" y="190" width="130" height="90" rx="14" fill="#0f172a"/>
    <text x="1075" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Product</text>
  </g>

  <!-- arrows along top row -->
  <line x1="250" y1="235" x2="300" y2="235" stroke="#1976d2" stroke-width="3" marker-end="url(#a)"/>
  <line x1="490" y1="235" x2="540" y2="235" stroke="#1976d2" stroke-width="3" marker-end="url(#a)"/>
  <line x1="730" y1="235" x2="780" y2="235" stroke="#1976d2" stroke-width="3" marker-end="url(#a)"/>
  <line x1="970" y1="235" x2="1010" y2="235" stroke="#1976d2" stroke-width="3" marker-end="url(#a)"/>

  <!-- docs branch from Token JSON -->
  <line x1="635" y1="280" x2="635" y2="370" stroke="#64748b" stroke-width="3" marker-end="url(#a2)"/>
  <rect x="470" y="370" width="330" height="100" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="635" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">build.py  →  75-page docs site</text>
  <text x="635" y="436" text-anchor="middle" font-size="14" fill="#475569">source files generate every page</text>
  <text x="635" y="457" text-anchor="middle" font-size="14" fill="#475569">docs stay in lockstep with the tokens</text>

  <text x="600" y="520" text-anchor="middle" font-size="15" fill="#94a3b8">Change a value in Figma → a PR regenerates the theme. No human retypes a hex code.</text>

  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1976d2"/></marker>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
  </defs>
</svg>
