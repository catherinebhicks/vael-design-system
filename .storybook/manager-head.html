<!-- IBM Plex for the Storybook manager chrome (sidebar, toolbar, brand).
     Self-hosted @fontsource files are copied into the build by the fonts import
     in preview; the manager loads them from Google Fonts as a lightweight
     progressive enhancement (falls back to the system UI font offline). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
