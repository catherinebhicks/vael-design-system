<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metric Callout — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide">

    <div class="eyebrow-row">
      <span class="index">07</span>
      <span class="eyebrow">Impact</span>
    </div>
    <h2 class="title">What the redesign moved</h2>

    <div class="stat-row">
      <div class="statcard">
        <div class="label">New enterprise users</div>
        <div class="value">15</div>
        <div class="trend"><span class="material-icons">&#xE8E5;</span>first quarter</div>
      </div>
      <div class="statcard">
        <div class="label">Accounts upgraded</div>
        <div class="value">8</div>
        <div class="trend"><span class="material-icons">&#xE8E5;</span>+2 recovered sales</div>
      </div>
      <div class="statcard">
        <div class="label">Task success rate</div>
        <div class="value">43<span class="unit">%</span></div>
        <div class="caption">up from 19% in first-click test</div>
      </div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
