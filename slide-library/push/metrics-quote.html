<!-- @dsCard group="Tier B — Rich decks" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metrics + Quote — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide">
    <div class="mq">
      <div class="stats-col">
        <div class="eyebrow-row"><span class="index">07</span><span class="eyebrow">Outcome</span></div>
        <div class="statcard">
          <div class="label">Reporting time</div>
          <div class="value">1<span class="unit"> day → 1 hr</span></div>
          <div class="trend"><span class="material-icons">&#xE8E5;</span>8× faster</div>
        </div>
        <div class="statcard">
          <div class="label">New enterprise accounts</div>
          <div class="value">15</div>
          <div class="trend"><span class="material-icons">&#xE8E5;</span>first two quarters</div>
        </div>
      </div>
      <div class="pullquote pullquote--blue" style="max-width:34ch">
        <p>“It <strong>cut our reporting time from a day to an hour.</strong>”</p>
        <p class="attribution">— VP of Insights, NetBase</p>
      </div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
