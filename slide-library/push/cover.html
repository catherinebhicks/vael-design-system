<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--top">

    <div class="eyebrow-row">
      <span class="eyebrow">Case Study</span>
    </div>

    <div class="cover-lead">
      <h1 class="title title--xl">NetBase&nbsp;Pro</h1>
      <p class="subtitle">Turning real-time social listening into decisions
        product teams actually trust.</p>
    </div>

    <div class="slide-footer">
      <div class="meta-item"><span class="k">Role</span><span class="v">Lead Product Designer</span></div>
      <div class="meta-item"><span class="k">Timeline</span><span class="v">2019 · 14 weeks</span></div>
      <div class="meta-item"><span class="k">Client</span><span class="v">NetBase Solutions</span></div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
