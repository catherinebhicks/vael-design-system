<!-- @dsCard group="Tier B — Rich decks" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before / After — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--top">
    <div class="eyebrow-row" style="margin-top:8px"><span class="index">05</span><span class="eyebrow">The redesign</span></div>
    <h2 class="title">From cluttered to decisive</h2>

    <div class="ba-grid">
      <div class="ba-col ba-col--before">
        <div class="ba-label"><span class="pip"></span> Before</div>
        <div class="browserframe">
          <div class="bar"><span class="dot" style="background:#e1552f66"></span><span class="dot" style="background:#e0a62f66"></span><span class="dot" style="background:#2e7d3266"></span><span class="url">legacy dashboard</span></div>
          <div class="slot slot--frame" style="min-height:300px"><span class="slot-tag">Old screenshot</span></div>
        </div>
        <p class="ba-caption">Twelve equally-weighted widgets, no clear entry point.</p>
      </div>
      <div class="ba-col ba-col--after">
        <div class="ba-label"><span class="pip"></span> After</div>
        <div class="browserframe">
          <div class="bar"><span class="dot" style="background:#e1552f66"></span><span class="dot" style="background:#e0a62f66"></span><span class="dot" style="background:#2e7d3266"></span><span class="url">app.netbase.com / dashboard</span></div>
          <div class="slot slot--frame" style="min-height:300px"><span class="slot-tag">New screenshot</span></div>
        </div>
        <p class="ba-caption">One headline metric, drill-down on demand.</p>
      </div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
