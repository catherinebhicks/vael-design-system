<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Section progress — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--accent">
    <div class="eyebrow-row"><span class="eyebrow">Part three of five</span></div>
    <div class="divider-num">03</div>
    <h1 class="divider-title">Designing the solution</h1>
    <div class="progress-track">
      <div class="progress-step done"><span class="ps-num">01</span> Overview</div>
      <div class="progress-step done"><span class="ps-num">02</span> Research</div>
      <div class="progress-step current"><span class="ps-num">03</span> Design</div>
      <div class="progress-step"><span class="ps-num">04</span> Results</div>
      <div class="progress-step"><span class="ps-num">05</span> Reflection</div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
