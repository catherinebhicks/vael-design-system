<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appendix divider — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--accent">
    <div class="eyebrow-row"><span class="eyebrow eyebrow--signal">Appendix</span></div>
    <div class="divider-num divider-num--faint">+</div>
    <h1 class="divider-title">Backup &amp; detail</h1>
    <p class="divider-desc">Supporting material for the deep questions — pull these in only if the room asks.
      The main story ended on the previous slide.</p>
    <div class="appendix-note"><span class="material-icons">&#xE88E;</span><span>Everything past here is optional</span></div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
