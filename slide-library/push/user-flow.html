<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>User Flow — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head><body>
  <section class="slide">
    <div class="eyebrow-row"><span class="index">04</span><span class="eyebrow">The lifecycle</span></div>
    <h2 class="title">One flow, end to end</h2>
    <div class="flow">
      <div class="flow-step"><div class="fn">01</div><h3>Create</h3><p>Pick a template or start blank.</p></div>
      <div class="flow-arrow"><span class="material-icons">&#xE5C8;</span></div>
      <div class="flow-step"><div class="fn">02</div><h3>Design</h3><p>Set metrics, axes, and thresholds.</p></div>
      <div class="flow-arrow"><span class="material-icons">&#xE5C8;</span></div>
      <div class="flow-step"><div class="fn">03</div><h3>Preview</h3><p>See the live read before you share.</p></div>
      <div class="flow-arrow"><span class="material-icons">&#xE5C8;</span></div>
      <div class="flow-step"><div class="fn">04</div><h3>Distribute</h3><p>Share, schedule, or set alerts.</p></div>
      <div class="flow-arrow"><span class="material-icons">&#xE5C8;</span></div>
      <div class="flow-step"><div class="fn">05</div><h3>Track</h3><p>Monitor and iterate over time.</p></div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body></html>
