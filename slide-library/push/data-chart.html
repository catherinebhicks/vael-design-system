<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Data Chart — Vael Slide Library</title>

  <section class="slide slide--top">

        <line class="gridln" x1="55" y1="170" x2="610" y2="170"/>

        <path class="area" d="M70,300 L176,272 L282,220 L388,150 L494,108 L600,60 L600,330 L70,330 Z"/>
        <path class="line" d="M70,300 L176,272 L282,220 L388,150 L494,108 L600,60"/>

        <line class="axis" x1="55" y1="330" x2="610" y2="330"/>

          <circle class="dot" cx="70" cy="300" r="5"/><circle class="dot" cx="176" cy="272" r="5"/>

      </svg>
      <div class="chart-note">
        <div class="big">15</div>
        <p>new enterprise accounts by end of Q2 — 8 of them upgrades from the free tier.</p>
      </div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
