<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hypothesis — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head><body>
  <section class="slide slide--top">
    <div class="eyebrow-row" style="margin-top:8px"><span class="index">03</span><span class="eyebrow">Hypothesis</span></div>
    <p class="belief">Analysts will trust the new dashboard because <span class="em">every number links to its source.</span></p>
    <div class="assumption">
      <div class="flag">◭ The untested assumption</div>
      <p>Baked into that sentence: that a faster read matters more to them than the depth they'd lose. We hadn't earned it by asking anyone — so we flagged it before drawing.</p>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body></html>
