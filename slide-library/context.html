<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Meta — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--top">
    <div class="eyebrow-row" style="margin-top:8px">
      <span class="index">01</span><span class="eyebrow">Overview</span>
    </div>
    <h2 class="title">The engagement</h2>

    <div class="meta-grid">
      <div class="meta-cell"><div class="k">Role</div><div class="v">Lead Product Designer</div></div>
      <div class="meta-cell"><div class="k">Team</div><div class="v">2 designers · 5 engineers · 1 PM</div></div>
      <div class="meta-cell"><div class="k">Timeline</div><div class="v">14 weeks · 2019</div></div>
      <div class="meta-cell"><div class="k">Platform</div><div class="v">Responsive web app</div></div>
      <div class="meta-cell"><div class="k">Tools</div><div class="v">Figma · Maze · Dovetail</div></div>
      <div class="meta-cell"><div class="k">Scope</div><div class="v">Research → IA → UI → handoff</div></div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
