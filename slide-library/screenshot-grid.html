<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenshot Grid — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--top">
    <div class="eyebrow-row" style="margin-top:8px"><span class="index">06</span><span class="eyebrow">The system</span></div>
    <h2 class="title">One language, every surface</h2>

    <div class="shot-grid">
      <div class="shot"><div class="slot"><span class="slot-tag">Dashboard</span></div></div>
      <div class="shot"><div class="slot"><span class="slot-tag">Compare view</span></div></div>
      <div class="shot"><div class="slot"><span class="slot-tag">Alerts</span></div></div>
      <div class="shot"><div class="slot"><span class="slot-tag">Report export</span></div></div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector('.slide');if(s)s.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')';}f();addEventListener('resize',f);})();</script>
</body>
</html>
