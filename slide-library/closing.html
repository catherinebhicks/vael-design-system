<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closing — Vael Slide Library</title>
<link rel="stylesheet" href="styles.css?v=6">
<style>html,body{margin:0;height:100%}body{background:#dbe2ec;display:flex;overflow:hidden;align-items:center;justify-content:center}.slide{flex:none}</style>
</head>
<body>
  <section class="slide slide--top">
    <div class="eyebrow-row" style="margin-bottom:28px"><span class="eyebrow eyebrow--signal">Thank you</span></div>
    <div class="cover-lead">
      <p class="closing"><span class="big">Let&#39;s build the next one.</span></p>
      <div class="closing">
        <div class="contact">
          <span><span class="material-icons">&#xE158;</span><span>catherine@afocuseddesign.com</span></span>
          <span><span class="material-icons">&#xE894;</span><span>afocuseddesign.com</span></span>
        </div>
      </div>
    </div>
    <div class="slide-footer">
      <div class="meta-item"><span class="k">Designer</span><span class="v">Catherine Hicks</span></div>
      <div class="meta-item"><span class="k">Studio</span><span class="v">A Focused Design Studio</span></div>
    </div>
  </section>
  <script>/*FIT-TO-VIEWPORT*/(function(){function f(){var s=document.querySelector(".slide");if(s)s.style.transform="scale("+Math.min(innerWidth/1280,innerHeight/720)+")";}f();addEventListener("resize",f);})();</script>
</body>
</html>
