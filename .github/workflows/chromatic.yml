name: Chromatic

# Publishes the Storybook to Chromatic on every push so there's a live,
# reviewable design-system reference. Requires the CHROMATIC_PROJECT_TOKEN
# repo secret (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full history for change detection

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true # TurboSnap — only snapshot what changed
          exitZeroOnChanges: true # don't fail the build on visual changes
